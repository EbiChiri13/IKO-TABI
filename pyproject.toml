[project]
name = "ikotabi"
version = "0.1.0"
description = "グループ旅行の行き先・宿・ごはん・観光スポットを、全員の希望から自動でマッチングする Web アプリのバックエンドです。"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic[email]>=2.13",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "torch>=2.6",
    "transformers>=5.0",
    "fugashi>=1.3",
    "ipadic>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx2>=2.13",
    "ruff>=0.6",
]

# このリポジトリは app/ を直接配置するアプリケーションであり、
# ビルドして配布するパッケージではないため、プロジェクト自身のインストールは行いません。
[tool.uv]
package = false

# 本番は CPU のみで動かすため、CUDA を含む既定ホイールではなく
# PyTorch の CPU 専用インデックスから torch を取得します。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: PostgreSQL を必要とする API 結合テスト",
]
